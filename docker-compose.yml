# Untested so far: Docker isn't installed on the dev machine yet.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: ev, POSTGRES_PASSWORD: ev, POSTGRES_DB: ev }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      EV_DATABASE_URL: postgresql+psycopg://ev:ev@db:5432/ev
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
